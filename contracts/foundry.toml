[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc_version   = "0.8.28"
evm_version    = "cancun"
optimizer      = true
optimizer_runs = 800
via_ir         = false
bytecode_hash  = "none"
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read",       path = "./test/vectors" },
]

[profile.default.fuzz]
runs = 512

# 512 × 256 = 131,072 calls per invariant, across two campaigns (1% fee and 0% fee).
# MEASURED, not guessed — see the note at the top of test/invariant/MarketInvariants.t.sol.
# `fail_on_revert = false` is the FILE-level default and is overridden back to `true` inline by
# the market invariant contracts, whose handler wraps every call in try/catch itself.
[profile.default.invariant]
runs            = 512
depth           = 256
fail_on_revert  = false

# Release profile: via_ir on. CI must build this profile so that
# "it only compiles without via_ir" can never slip through unnoticed.
[profile.prod]
via_ir         = true
optimizer_runs = 20000

[profile.ci.fuzz]
runs = 4096

# 4× the default in each dimension, the same ratio this profile carried before.
# MEASURED on a 32-core box: 4m32s wall / 61m CPU for the whole of test/invariant, which is
# 1,048,576 calls per invariant × 15 invariants × 2 campaigns ≈ 31M market calls. Divide the CPU
# figure by the runner's core count to budget it; a 4-core runner is roughly 15 minutes.
[profile.ci.invariant]
runs  = 2048
depth = 512

[fmt]
line_length = 120
tab_width   = 4
bracket_spacing = false
int_types   = "long"

[rpc_endpoints]
local   = "http://127.0.0.1:8545"
galileo = "${ZERO_G_TESTNET_RPC}"
mainnet = "${ZERO_G_MAINNET_RPC}"

# 0G's explorer speaks the Etherscan API under /open/api, but forge has no built-in
# entry for chain 16602 — without this it refuses with "No known Etherscan API URL".
# The key is ignored by the endpoint; it is required only because the flag is.
# 0G's explorer speaks the Etherscan API under /open/api, but forge has no
# built-in entry for chain 16602 and an `[etherscan]` block for it breaks every
# `forge script` with "Chain 16602 not supported" — a message that never mentions
# verification. Verify with the blockscout verifier and an explicit URL instead,
# which needs no chain lookup:
#
#   forge verify-contract <addr> <path:Name> --verifier blockscout \
#     --verifier-url https://chainscan-galileo.0g.ai/open/api \
#     --compiler-version 0.8.28 --num-of-optimizations 800
